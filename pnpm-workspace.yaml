allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  sharp: true
  unrs-resolver: true
onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@swc/core'
  - esbuild
  - sharp
  - unrs-resolver
# Security floors for transitive deps (pnpm audit --prod); drop once parents ship fixed ranges.
overrides:
  brace-expansion@>=2 <5.0.12: ^5.0.12
  minimatch@>=10 <11.0.1: ^11.0.1
  browserslist@<4.28.7: ^4.28.7
  nanoid@>=3 <3.3.18: ^3.3.18
  source-map-js@<1.2.2: ^1.2.2
  baseline-browser-mapping@<2.11.0: ^2.11.0
