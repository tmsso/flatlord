name: Production health check

# The app is the system of record now (billing, meter readings, backups) —
# a dead deploy or a paused prod Supabase project shouldn't go unnoticed
# for a month. Hits the public /api/health route (src/app/api/health/
# route.ts), which does a real Supabase query server-side — a plain
# homepage ping wouldn't catch "app is up but the database isn't."
#
# No secret required: this uses GitHub's own workflow-failure notification
# (emails the repo owner on a failed scheduled run) rather than a
# dedicated alerting integration — deliberately, to avoid adding a new
# external-service credential as a repo secret for this. Alert *delivery*
# (not just detection) depends on the repo owner's GitHub notification
# settings (Settings > Notifications > Actions) — unverified as of
# 2026-08-05, see IDEAS.md. Revisit if a richer alert (Slack, SMS) is
# ever wanted.
on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours, off-the-hour
  workflow_dispatch:
    inputs:
      simulate_pending:
        description: "Drift-check self-test: pretend main has this many unapplied migrations (0 = real check)"
        required: false
        default: "0"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check production health endpoint
        run: |
          status=$(curl -s -o /tmp/health-body.json -w "%{http_code}" \
            "https://flatlord.vercel.app/api/health")
          echo "Response: HTTP $status"
          cat /tmp/health-body.json
          if [ "$status" != "200" ]; then
            echo "::error::Production health check failed (HTTP $status) — app may be down or Supabase prod may be unreachable."
            exit 1
          fi

  # B-12: prod sat three weeks behind on migrations (incl. the 0027 security
  # fix) and nothing went red. This compares prod's drizzle bookkeeping with
  # main's journal using the migrator's own rule — drizzle applies every
  # journal entry whose `when` is newer than the newest applied
  # `created_at` — so "pending" here means exactly what migrate-prod.yml
  # would apply. Read-only: one SELECT on prod.
  #
  # Prod *ahead* of main is normal for a short while: D-30 has the owner run
  # migrate-prod.yml against a PR branch before merging it. That only warns;
  # prod *behind* main (code expecting a schema prod lacks) fails.
  migration-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compare prod migrations with main's journal
        env:
          SUPABASE_DB_URL_PROD: ${{ secrets.SUPABASE_DB_URL_PROD }}
          # Manual-dispatch knob to prove the check fails on drift (B-12's
          # "done means"): pretends main has N extra pending migrations.
          SIMULATE_PENDING: ${{ inputs.simulate_pending || '0' }}
        run: |
          read -r journal_count journal_latest < <(node -e '
            const j = require("./supabase/migrations/meta/_journal.json");
            console.log(j.entries.length, Math.max(...j.entries.map((e) => e.when)));
          ')
          read -r prod_count prod_latest < <(psql "$SUPABASE_DB_URL_PROD" -tA -F ' ' -c \
            "select count(*), coalesce(max(created_at), 0) from drizzle.__drizzle_migrations")
          pending=$(node -e '
            const j = require("./supabase/migrations/meta/_journal.json");
            console.log(j.entries.filter((e) => e.when > Number(process.argv[1])).length + Number(process.argv[2]));
          ' "$prod_latest" "$SIMULATE_PENDING")
          echo "main journal: $journal_count migrations · prod applied: $prod_count · pending on prod: $pending"
          if [ "$pending" != "0" ]; then
            echo "::error::Prod is $pending migration(s) behind main — run migrate-prod.yml (D-14/D-30)."
            exit 1
          fi
          if [ "$prod_latest" -gt "$journal_latest" ]; then
            echo "::warning::Prod has a migration main doesn't (newest applied $prod_latest > journal $journal_latest) — expected only between migrate-prod and merging its PR (D-30)."
          fi

  # B-50: did the daily cron (vercel.json, 07:00 UTC) run and finish? Only
  # scheduled runs count (manual triggers log as 'daily-reminders:manual'). Vercel
  # Hobby keeps runtime logs ~30 min, so the app records each run in
  # cron_runs (migration 0036) and this reads the newest one. Read-only:
  # two SELECTs on prod. Fails on: no run in 26 h, a 'failed' run, or a run
  # still 'running' after 10 min (killed at Vercel's 300 s limit — its
  # phases list shows the last completed phase). Before 0036 is on prod it
  # only warns.
  cron-last-run:
    runs-on: ubuntu-latest
    steps:
      - name: Check the newest daily-reminders run
        env:
          SUPABASE_DB_URL_PROD: ${{ secrets.SUPABASE_DB_URL_PROD }}
        run: |
          exists=$(psql "$SUPABASE_DB_URL_PROD" -tA -c "select to_regclass('public.cron_runs') is not null")
          if [ "$exists" != "t" ]; then
            echo "::warning::cron_runs doesn't exist on prod yet — run migrate-prod.yml (0036)."
            exit 0
          fi
          row=$(psql "$SUPABASE_DB_URL_PROD" -tA -F '|' -c \
            "select status, extract(epoch from now() - started_at)::int, started_at, phases::text
               from cron_runs where job = 'daily-reminders' order by started_at desc limit 1")
          if [ -z "$row" ]; then
            echo "::warning::No daily-reminders run recorded yet."
            exit 0
          fi
          IFS='|' read -r status age started phases <<< "$row"
          echo "newest run: status=$status started=$started (${age}s ago)"
          echo "phases: $phases"
          if [ "$age" -gt 93600 ]; then
            echo "::error::No daily-reminders run in the last 26 h — is CRON_SECRET still set / the cron enabled?"
            exit 1
          fi
          if [ "$status" = "failed" ]; then
            echo "::error::The newest daily-reminders run failed — see the error column in cron_runs."
            exit 1
          fi
          if [ "$status" = "running" ] && [ "$age" -gt 600 ]; then
            echo "::error::The newest daily-reminders run never finished (likely killed at the 300 s limit) — last completed phase is the last entry above."
            exit 1
          fi
